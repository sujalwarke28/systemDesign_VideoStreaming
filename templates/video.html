{% extends "base.html" %}

{% block title %}Watch Video - StreamTube{% endblock %}

{% block content %}
<div class="row">
    <div class="col-lg-8">
        <!-- Video Player -->
        <div class="ratio ratio-16x9 mb-4 bg-black rounded-4 overflow-hidden shadow-lg">
            <video id="video-player" src="/videos/stream/{{ video_id }}" controls autoplay>
                Your browser does not support the video tag.
            </video>
        </div>
        
        <!-- Metadata -->
        <div class="d-flex justify-content-between align-items-start mb-3">
            <div>
                <h3 class="fw-bold mb-1" id="video-title">Loading...</h3>
                <p class="text-muted mb-0" id="video-views">... views</p>
            </div>
            <button class="btn btn-outline-light rounded-pill px-4 fw-bold" id="like-btn"><i class="bi bi-hand-thumbs-up me-1"></i> Like <span id="like-count">0</span></button>
        </div>
        
        <div class="bg-dark p-3 rounded-4 border border-secondary mb-5">
            <div id="video-tags" class="mb-2"></div>
            <p id="video-desc" class="mb-0 text-light"></p>
        </div>
        
        <!-- Comments -->
        <h4 class="fw-bold mb-4">Comments</h4>
        <form id="comment-form" class="mb-4 d-flex">
            <input type="text" class="form-control bg-secondary border-0 text-white me-2 rounded-pill px-4" id="comment-text" placeholder="Add a comment..." required>
            <button type="submit" class="btn btn-primary rounded-pill px-4 fw-bold">Post</button>
        </form>
        
        <div id="comments-list">
            <!-- Comments injected by JS -->
            <p class="text-muted">Loading comments...</p>
        </div>
    </div>
    
    <!-- Sidebar -->
    <div class="col-lg-4 d-none d-lg-block">
        <h5 class="fw-bold mb-3">Up Next</h5>
        <div id="up-next-list">
            <!-- Related/Trending videos injected here -->
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const videoId = "{{ video_id }}";
    
    document.addEventListener("DOMContentLoaded", async () => {
        const token = localStorage.getItem("access_token");
        let currentUserId = null;

        if(token) {
            // Record History
            fetch(`/playlists/history/${videoId}`, {
                method: "POST",
                headers: { "Authorization": `Bearer ${token}` }
            }).catch(e => console.log("History failed", e));

            // Fetch current user details
            try {
                const meRes = await fetch('/auth/me', { headers: { "Authorization": `Bearer ${token}` } });
                if(meRes.ok) {
                    const meData = await meRes.json();
                    currentUserId = meData.id;
                }
            } catch(e) { console.log(e); }
        }

        // Fetch likes
        fetch(`/social/videos/${videoId}/likes/count`)
            .then(r => r.json())
            .then(data => document.getElementById('like-count').innerText = data.likes);

        // Fetch comments
        loadComments();
        
        // Fetch Video Data
        fetch('/videos/')
            .then(r => r.json())
            .then(videos => {
                const video = videos.find(v => v.id === videoId);
                if(video) {
                    document.getElementById('video-title').innerText = video.title;
                    document.getElementById('video-views').innerText = `${video.views} views`;
                    document.getElementById('video-desc').innerText = video.description;
                    document.getElementById('video-tags').innerHTML = video.tags.map(t => `<span class="badge bg-secondary me-1">${t}</span>`).join('');
                    
                    // Add delete button if creator
                    if(currentUserId === video.creator_id) {
                        const btnGroup = document.getElementById('like-btn').parentElement;
                        const delBtn = document.createElement('button');
                        delBtn.className = "btn btn-outline-danger rounded-pill px-4 fw-bold ms-2";
                        delBtn.innerHTML = '<i class="bi bi-trash3-fill me-1"></i> Delete';
                        delBtn.onclick = async () => {
                            if(confirm("Are you sure you want to delete this video?")) {
                                const res = await fetch(`/videos/${videoId}`, {
                                    method: 'DELETE',
                                    headers: { "Authorization": `Bearer ${token}` }
                                });
                                if(res.ok) {
                                    alert("Video deleted successfully.");
                                    window.location.href = '/';
                                } else {
                                    alert("Failed to delete video.");
                                }
                            }
                        };
                        btnGroup.appendChild(delBtn);
                    }
                }
            });
    });

    // Handle Like
    document.getElementById('like-btn').addEventListener('click', async () => {
        const token = localStorage.getItem("access_token");
        if(!token) return alert("Please login to like!");
        
        const res = await fetch(`/social/videos/${videoId}/like`, {
            method: "POST",
            headers: { "Authorization": `Bearer ${token}` }
        });
        if(res.ok) {
            // refresh like count
            fetch(`/social/videos/${videoId}/likes/count`)
                .then(r => r.json())
                .then(data => document.getElementById('like-count').innerText = data.likes);
        }
    });

    // Handle Comment
    document.getElementById('comment-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const token = localStorage.getItem("access_token");
        if(!token) return alert("Please login to comment!");
        
        const text = document.getElementById('comment-text').value;
        const res = await fetch(`/social/videos/${videoId}/comments?text=${encodeURIComponent(text)}`, {
            method: "POST",
            headers: { "Authorization": `Bearer ${token}` }
        });
        
        if(res.ok) {
            document.getElementById('comment-text').value = '';
            loadComments();
        }
    });

    function loadComments() {
        fetch(`/social/videos/${videoId}/comments`)
            .then(r => r.json())
            .then(comments => {
                const list = document.getElementById('comments-list');
                if(comments.length === 0) {
                    list.innerHTML = '<p class="text-muted">No comments yet.</p>';
                    return;
                }
                list.innerHTML = comments.map(c => `
                    <div class="mb-3 pb-3 border-bottom border-secondary">
                        <p class="mb-1 fw-bold text-light">User</p>
                        <p class="mb-0 text-muted">${c.text}</p>
                    </div>
                `).join('');
            });
    }
</script>
{% endblock %}
