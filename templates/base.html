<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Video Streaming Platform{% endblock %}</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' fill='%23dc3545'><path d='M0 12V4a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2m6.79-6.907A.5.5 0 0 0 6 5.5v5a.5.5 0 0 0 .79.407l3.5-2.5a.5.5 0 0 0 0-.814l-3.5-2.5z'/></svg>" type="image/svg+xml">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/style.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Global Toast Container -->
    <div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1100;">
        <div id="globalToast" class="toast align-items-center text-white border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body fw-semibold" id="globalToastMessage">Message</div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
        <div class="container-fluid px-3">
            <div class="d-flex align-items-center">
                <button class="btn text-white me-3 px-2 border-0" id="hamburger-btn">
                    <i class="bi bi-list fs-3"></i>
                </button>
                <a class="navbar-brand fw-bold" href="/"><i class="bi bi-play-btn-fill text-danger me-2"></i>StreamTube</a>
            </div>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarNav">
                <form class="d-flex mx-auto w-50" id="search-form">
                    <input class="form-control me-2 rounded-pill bg-secondary border-0 text-white" type="search" id="search-input" placeholder="Search videos...">
                    <button class="btn btn-outline-light rounded-pill px-4" type="submit">Search</button>
                </form>
                <ul class="navbar-nav ms-auto" id="nav-links">
                    <!-- Injected by JS -->
                </ul>
            </div>
        </div>
    </nav>

    <div class="d-flex">
        <!-- Sidebar -->
        <nav class="bg-dark border-end border-secondary d-none {% block sidebar_class %}d-md-block{% endblock %}" style="width: 250px; min-height: calc(100vh - 56px); transition: margin-left 0.2s;" id="sidebar-nav">
            <div class="list-group list-group-flush rounded-0 mt-3 position-sticky" style="top: 76px;">
                <a href="/" class="list-group-item list-group-item-action bg-transparent text-white border-0 py-3 px-4 fw-bold">
                    <i class="bi bi-house-door-fill me-2 fs-5"></i> Home
                </a>
                <a href="/trending" class="list-group-item list-group-item-action bg-transparent text-white border-0 py-3 px-4 fw-bold">
                    <i class="bi bi-fire text-danger me-2 fs-5"></i> Trending
                </a>
                <a href="/history" class="list-group-item list-group-item-action bg-transparent text-white border-0 py-3 px-4 fw-bold">
                    <i class="bi bi-clock-history me-2 fs-5"></i> History
                </a>
                <a href="/liked" class="list-group-item list-group-item-action bg-transparent text-white border-0 py-3 px-4 fw-bold">
                    <i class="bi bi-hand-thumbs-up-fill me-2 fs-5"></i> Liked Videos
                </a>
            </div>
        </nav>
        
        <!-- Main Content -->
        <div class="flex-grow-1 p-4" id="main-content">
            <div class="container">
                {% block content %}{% endblock %}
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/main.js"></script>
    <script>
        document.getElementById('hamburger-btn').addEventListener('click', () => {
            const sidebar = document.getElementById('sidebar-nav');
            if(sidebar) {
                if(sidebar.classList.contains('d-none')) {
                    sidebar.classList.remove('d-none');
                    sidebar.classList.add('d-md-block');
                } else {
                    sidebar.classList.add('d-none');
                    sidebar.classList.remove('d-md-block');
                }
            }
        });
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
