{% extends "base.html" %}

{% block title %}Upload Video - StreamTube{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <h2 class="mb-4 fw-bold">Upload a New Video</h2>
        <div class="bg-dark p-4 rounded-4 shadow-sm border border-secondary">
            <form id="upload-form">
                <div class="mb-3">
                    <label class="form-label text-muted">Video Title</label>
                    <input type="text" class="form-control bg-secondary border-0 text-white" id="video-title" required>
                </div>
                <div class="mb-3">
                    <label class="form-label text-muted">Description</label>
                    <textarea class="form-control bg-secondary border-0 text-white" id="video-desc" rows="4" required></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label text-muted">Tags (comma separated)</label>
                    <input type="text" class="form-control bg-secondary border-0 text-white" id="video-tags" placeholder="e.g., coding, python, tutorial">
                </div>
                <div class="mb-4">
                    <label class="form-label text-muted">Video File (.mp4)</label>
                    <input class="form-control bg-secondary border-0 text-white" type="file" id="video-file" accept="video/mp4,video/x-m4v,video/*" required>
                </div>
                <div class="mb-4">
                    <label class="form-label text-muted">Thumbnail Image (optional)</label>
                    <input class="form-control bg-secondary border-0 text-white" type="file" id="thumbnail-file" accept="image/*">
                </div>
                <button type="submit" class="btn btn-primary px-5 rounded-pill fw-bold" id="upload-btn">Upload Video</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
