{% extends "base.html" %}

{% block title %}Sign in - StreamTube{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 75vh;">
    <div class="col-md-6 col-lg-4">
        <div class="bg-dark p-5 rounded-4 shadow-lg text-center" style="background-color: #272727 !important; border: 1px solid #3d3d3d;">
            <h3 class="fw-bold mb-1 text-white"><i class="bi bi-play-btn-fill text-danger me-2"></i>StreamTube</h3>
            <p class="text-secondary mb-4">Sign in to continue</p>
            
            <ul class="nav nav-pills mb-4 nav-justified" id="pills-tab" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active rounded-pill fw-bold" id="pills-login-tab" data-bs-toggle="pill" data-bs-target="#pills-login" type="button" style="font-size: 0.9rem;">Sign In</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link rounded-pill fw-bold" id="pills-register-tab" data-bs-toggle="pill" data-bs-target="#pills-register" type="button" style="font-size: 0.9rem;">Create Account</button>
                </li>
            </ul>
            
            <div class="tab-content text-start" id="pills-tabContent">
                <!-- Login -->
                <div class="tab-pane fade show active" id="pills-login">
                    <form id="login-form">
                        <div class="form-floating mb-3">
                            <input type="text" class="form-control bg-transparent text-white" id="login-username" placeholder="Username" style="border: 1px solid #555;" required>
                            <label for="login-username" class="text-secondary">Username</label>
                        </div>
                        <div class="form-floating mb-4">
                            <input type="password" class="form-control bg-transparent text-white" id="login-password" placeholder="Password" style="border: 1px solid #555;" required>
                            <label for="login-password" class="text-secondary">Password</label>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 rounded-pill fw-bold py-2" style="background-color: #3ea6ff; border: none; color: #000;">Next</button>
                    </form>
                </div>
                
                <!-- Register -->
                <div class="tab-pane fade" id="pills-register">
                    <form id="register-form">
                        <div class="form-floating mb-3">
                            <input type="text" class="form-control bg-transparent text-white" id="reg-username" placeholder="Username" style="border: 1px solid #555;" required>
                            <label for="reg-username" class="text-secondary">Username</label>
                        </div>
                        <div class="form-floating mb-3">
                            <input type="email" class="form-control bg-transparent text-white" id="reg-email" placeholder="Email" style="border: 1px solid #555;" required>
                            <label for="reg-email" class="text-secondary">Email address</label>
                        </div>
                        <div class="form-floating mb-4">
                            <input type="password" class="form-control bg-transparent text-white" id="reg-password" placeholder="Password" style="border: 1px solid #555;" required>
                            <label for="reg-password" class="text-secondary">Password</label>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 rounded-pill fw-bold py-2" style="background-color: #3ea6ff; border: none; color: #000;">Create Account</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
