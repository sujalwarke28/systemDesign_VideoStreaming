{% extends "base.html" %}

{% block title %}Login / Register - StreamTube{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <ul class="nav nav-pills mb-3 nav-justified" id="pills-tab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active rounded-pill" id="pills-login-tab" data-bs-toggle="pill" data-bs-target="#pills-login" type="button">Login</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link rounded-pill" id="pills-register-tab" data-bs-toggle="pill" data-bs-target="#pills-register" type="button">Register</button>
            </li>
        </ul>
        
        <div class="tab-content bg-dark p-4 rounded-4 shadow-sm border border-secondary" id="pills-tabContent">
            <!-- Login -->
            <div class="tab-pane fade show active" id="pills-login">
                <form id="login-form">
                    <div class="mb-3">
                        <label class="form-label text-muted">Username</label>
                        <input type="text" class="form-control bg-secondary border-0 text-white" id="login-username" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label text-muted">Password</label>
                        <input type="password" class="form-control bg-secondary border-0 text-white" id="login-password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 rounded-pill fw-bold">Login</button>
                </form>
            </div>
            
            <!-- Register -->
            <div class="tab-pane fade" id="pills-register">
                <form id="register-form">
                    <div class="mb-3">
                        <label class="form-label text-muted">Username</label>
                        <input type="text" class="form-control bg-secondary border-0 text-white" id="reg-username" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-muted">Email</label>
                        <input type="email" class="form-control bg-secondary border-0 text-white" id="reg-email" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label text-muted">Password</label>
                        <input type="password" class="form-control bg-secondary border-0 text-white" id="reg-password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 rounded-pill fw-bold">Create Account</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
